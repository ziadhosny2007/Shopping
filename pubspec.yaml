name: shopping
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  flutter_bloc: ^9.1.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  animate_do: ^5.1.0
  smooth_page_indicator: ^3.0.0
  loading_animation_widget: ^1.3.0
  shared_preferences: ^2.5.5
  http: ^1.6.0
  cached_network_image: ^3.4.1
  get_it: ^9.3.0
  injectable: ^3.0.0
  injectable_generator: ^3.0.2
  dio: ^5.11.1
  shimmer: ^3.0.0
  bloc: ^9.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon.png"
  adaptive_icon_background: "#5F33E1"
  remove_alpha_ios: true
